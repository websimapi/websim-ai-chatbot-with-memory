<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot with Memory</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="settings-controls">
    <div class="toggle-container">
      <div class="toggle-icons" id="requestModeIcons">
        <img src="w.png" alt="Single Request" class="mode-w active">
      </div>
      <label class="toggle-switch">
        <select id="requestModeToggle" class="mode-select">
          <option value="single">Single</option>
          <option value="dual">Dual</option>
          <option value="advanced">Advanced</option>
        </select>
      </label>
    </div>
    <div class="toggle-container">
      <div class="toggle-icons">
        <span>🎤</span>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="ttsToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>
  <div class="token-container" id="tokenContainer"></div>
  <div class="chat-container">
    <div class="chat-history" id="chatHistory"></div>
    <div class="input-container">
      <input type="text" id="userInput" placeholder="Type your message...">
      <button id="sendBtn">Send</button>
    </div>
  </div>
  <script type="module" src="app.js"></script>
  <script type="module" src="memory.js"></script>
  <script type="module" src="speech.js"></script>
  <script type="module" src="settings.js"></script>
  <script type="module" src="artifact-renderer.js"></script>
  <script type="module" src="code-manager.js"></script>

</body>
</html>
